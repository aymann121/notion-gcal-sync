name: Renew Google Calendar push channel

on:
  schedule:
    # Every 2 days; watch_gcal.py opens 7-day channels, so a channel survives
    # even if GitHub drops two scheduled runs in a row. Off-minute for the
    # same reason as sync.yml.
    - cron: "23 12 */2 * *"
  workflow_dispatch: {}

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - run: python watch_gcal.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}
          RELAY_URL: ${{ secrets.RELAY_URL }}
          GCAL_CHANNEL_TOKEN: ${{ secrets.GCAL_CHANNEL_TOKEN }}
