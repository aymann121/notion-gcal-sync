name: Notion <-> Google Tasks + Calendar Sync

on:
  # Near-real-time path: supabase/functions/relay forwards Notion webhooks and Google
  # Calendar push notifications here. Google Tasks has no push API, so its
  # edits only arrive via the fallback cron below.
  repository_dispatch:
    types: [notion-change, gcal-change]
  schedule:
    # Fallback: hourly, 9am-11pm US Eastern (fixed at UTC-4 / EDT). Cron is
    # always UTC and doesn't shift for DST, so during EST (~Nov-Mar) these run
    # 1 hour later than intended local time. Minute :17, not :00: GitHub drops
    # scheduled runs under load, and the top of the hour is the busiest.
    - cron: "17 13-23,0-3 * * *"
  workflow_dispatch: {}       # lets you trigger it manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so rebase can land cleanly when main moved mid-run.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The relay's Supabase project (free plan) pauses after ~7 days without
      # database activity, and the relay itself never queries the database.
      # This call keeps it awake. The publishable key is public by design.
      - name: Keep relay's Supabase project awake
        continue-on-error: true
        run: >
          curl -fsS -X POST https://nwdulegrvumwcygvohhd.supabase.co/rest/v1/rpc/keepalive
          -H "apikey: sb_publishable_XoyE20Yc26JfNp9yfqSM2Q_GqjRJaCN"
          -H "Content-Type: application/json" -d '{}'

      - run: pip install -r requirements.txt

      - name: Restore sync state
        uses: actions/cache@v4
        with:
          path: sync_state.json
          key: sync-state-${{ github.run_id }}
          restore-keys: sync-state-

      - run: python sync.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          GOOGLE_CALENDAR_ID: ${{ secrets.GOOGLE_CALENDAR_ID }}
          GOOGLE_TOKEN_JSON: ${{ secrets.GOOGLE_TOKEN_JSON }}

      - name: Commit updated sync state
        run: |
          git config user.name "sync-bot"
          git config user.email "sync-bot@users.noreply.github.com"
          git add sync_state.json
          if git diff --quiet --cached; then
            echo "No sync_state.json changes to commit."
            exit 0
          fi
          git commit -m "Update sync state [skip ci]"

          # Another run (or a human push) may have updated main while we synced.
          # Rebase and retry instead of failing the job.
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}"
            if git push origin "HEAD:${GITHUB_REF_NAME}"; then
              exit 0
            fi
            echo "Push rejected (attempt $i); retrying..."
            sleep $((i * 2))
          done
          echo "Failed to push sync state after retries."
          exit 1
