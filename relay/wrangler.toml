name = "notion-gcal-sync-relay"
main = "worker.js"
compatibility_date = "2026-09-01"

[vars]
GITHUB_REPO = "aymann121/notion-gcal-sync"
# The sync integration's own bot user id (see relay/README.md). Webhooks
# authored only by it are dropped so a sync doesn't trigger another sync.
NOTION_BOT_ID = ""

# Secrets (set with `npx wrangler secret put <NAME>`, never committed):
#   GITHUB_TOKEN               fine-grained PAT, this repo only, Contents: read/write
#   GCAL_CHANNEL_TOKEN         random string, same value as the repo secret
#   NOTION_VERIFICATION_TOKEN  from the Notion subscription handshake
